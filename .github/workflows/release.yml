name: Release Build

# 打一个 v* 的 tag（如 v1.2.3）就会自动构建 APK 并创建 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 镜像自带 Android SDK（ANDROID_SDK_ROOT 已设好），这里只补需要的包，
      # 不走 android-actions/setup-android（它在 runner 上会失败）
      - name: Install SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=$(command -v sdkmanager); fi
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 仓库里没有 gradle wrapper（本机用固定版本的 Gradle 目录构建），CI 用 setup-gradle 提供的 gradle；
      # 显式指定 :app 模块，不构建独立的 testapp 工程。不配置任何签名 secrets/keystore。
      - name: Build unsigned release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/AppRotate-release.apk
          ls -l out

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: out/AppRotate-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
